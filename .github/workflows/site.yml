name: Site quality and Pages

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global pnpm@12.3.4

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify install is workspace-stable
        run: git diff --exit-code -- pnpm-workspace.yaml

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Verify source structure
        run: node scripts/verify-source.mjs

      - name: Run quality and browser certification
        run: pnpm check

      - name: Upload Playwright certification report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-certification-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload verified Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@v5
